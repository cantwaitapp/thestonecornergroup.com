<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Stone Corner Group</title>
<meta name="description" content="The Stone Corner Group">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  :root {
    /* SIZE: logo width in pixels. Everything else follows. */
    --logo-width: 160px;
    --bg: #ffffff;
    --text: #858585;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
  .stack { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  img { display: block; width: var(--logo-width); height: auto; user-select: none; -webkit-user-drag: none; }
  h1 {
    margin: 0; font-weight: 400; font-size: 0.72rem; letter-spacing: 0.32em;
    color: var(--text); text-transform: uppercase; white-space: nowrap;
  }
  h1 b { font-weight: 400; font-size: 0.82rem; }
</style>
</head>
<body>
<main>
  <div class="stack">
    <img src="logo.png" alt="The Stone Corner Group" width="322" height="238" draggable="false">
    <h1><b>T</b>he <b>S</b>tone<b>C</b>orner <b>G</b>roup</h1>
  </div>
</main>
</body>
</html>
